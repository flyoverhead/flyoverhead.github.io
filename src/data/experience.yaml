roles:
  - title: DevOps Tech Lead
    employer: Positive Technologies
    start: 2025-05
    end: null
    team: 4
    summary: Lead a team of 4 engineers on IaC architecture and drive AI adoption in DevOps workflows.
    highlights:
      - Designed and built a marketplace of Claude Code plugins for infrastructure work. Terraform module delivery went from weeks to days, Ansible roles from a week to a day.
      - Architected and launched a fully managed Kubernetes service on OpenStack.
