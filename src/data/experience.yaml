      - Built zero-downtime CI/CD pipelines and managed ephemeral and persistent staging, dev and stress environments.
      - Modernised infrastructure with Terraform, Ansible and Puppet. Set technical roadmaps and owned the full hiring lifecycle.
  - title: Senior DevOps Engineer
    employer: RusBITech-Astra
    start: 2022-04
    end: 2023-04
