      - Hiring, onboarding and mentoring, with explicit limits on team cognitive load. Cross-team work organised with Team Topologies.
  - title: DevOps Engineer
    employer: Positive Technologies
    start: 2023-11
    end: 2025-05
    summary: Built the organisation's IaC platform from scratch and moved corporate services from monoliths to Kubernetes.
    highlights:
      - Delivered a production-ready IaC platform within the probation period. It was adopted as the organisation's standard for service delivery.
      - Built a catalog of reusable GitLab CI components and standard execution environments for Terraform, OpenTofu and Ansible.
      - Integrated HashiCorp Vault for central secrets management with dynamic injection into CI, which removed hard-coded credentials.
      - Set up a private Terraform registry and Ansible roles and collections across AWS, OpenStack and VMware.
      - Ran the zero-downtime launch of a large, mission-critical DNS service on the new platform.
  - title: DevOps Team Lead
    employer: RusBITech-Astra
    start: 2023-04
    end: 2023-10
    team: 8
    summary: Led and grew a unit of 8 engineers responsible for CI/CD, environments and infrastructure as code.
    highlights:
