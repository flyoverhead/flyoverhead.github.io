# Featured plugins from the team marketplace, ordered by how often they are used.
- name: ansible
  daily: true
  summary: Create, check and test Ansible roles to the team's standard.
  skills: [role-creator, role-checker, molecule-scaffolder]
  agents: [ansible-engineer]
  useCase: >-
    New roles start from the standard layout (detect, install, configure, update; prefixed
    variables; fully qualified modules). Existing roles are checked and auto-fixed before review,
    and molecule test suites are scaffolded role by role. The agent helps design changes that span
    many roles and hosts.
- name: pre-commit
  daily: true
  summary: Install and run the team's containerised linters.
  skills: [pre-commit-installer, pre-commit-runner]
  useCase: >-
    Runs ansible-lint, yamllint, terraform fmt, tflint and JSON/YAML checks in the same container
    image as CI and fixes what it can, so lint failures show up on my machine instead of in a
    shared pipeline.
- name: jira
  daily: true
  summary: Write tickets to the team's conventions.
  skills: [jira-tickets]
  useCase: >-
    Turns a piece of work into an epic and tasks with the required structure and content, and
    links them to commits and merge requests through commit trailers.
- name: terraform
  summary: Scaffold config-driven Terraform modules and providers.
  skills: [module-creator, provider-creator]
  agents: [terraform-engineer]
  useCase: >-
    New modules follow the team's YAML-driven layout with input validation, and new providers use
    the Terraform Plugin Framework. This is where delivering a Terraform module went from weeks to
    days.
- name: golang
  summary: Idiomatic, tested Go for services and CLIs.
  skills: [golang-patterns, golang-concurrency, golang-optimization, test, review, scaffold]
  agents: [golang-architect, golang-performance, golang-pro]
  useCase: >-
    Scaffolds Go services and CLIs, writes table-driven tests that run under the race detector,
    reviews code with the standard linters, and proves performance changes with benchmarks and
    profiles.
- name: glab
  summary: GitLab CLI setup and batch cloning.
  skills: [glab-installer, glab-cloner]
  useCase: >-
    Sets up the GitLab CLI on a new machine and clones whole groups or lists of repositories at
    once, the first step of any change that touches many repositories.
